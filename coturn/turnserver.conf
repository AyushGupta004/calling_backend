# =============================================================================
# Coturn Server Configuration (turnserver.conf)
# Compatible with calling-backend REST API ephemeral credentials
# =============================================================================

# Listening ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=0
alt-tls-listening-port=0

# Listening interface (all interfaces)
listening-ip=0.0.0.0

# Public IP address of the server (REQUIRED if behind NAT / Cloud VPC)
# Replace with your VM's public IPv4 address
# external-ip=YOUR_SERVER_PUBLIC_IP

# Domain realm for credentials authentication
realm=turn.example.com

# Relay IP / port ranges (UDP relay ports for media streams)
min-port=49152
max-port=65535

# REST API dynamic authentication (draft-uberti-behave-turn-rest-00)
# Enables time-limited dynamic credentials generated by calling-backend
use-auth-secret
static-auth-secret=calling-backend-turn-secret-key

# Authentication mechanisms and security options
fingerprint
lt-cred-mech
stale-nonce=600

# TLS Certificate configuration (optional, for turns: on 5349)
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# CLI and administrative control
no-cli
no-loopback-peers
no-multicast-peers

# Logging
verbose
log-file=/var/log/turnserver/turnserver.log
syslog
